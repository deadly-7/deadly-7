<svg xmlns="http://www.w3.org/2000/svg" width="900" height="64" viewBox="0 0 900 64" role="img" aria-label="02. MIYU">
<style>
@font-face{font-family:'Orb';src:url(data:font/woff2;base64,) format('woff2');font-weight:900}
.orb{font-family:'Orb','Arial Black',sans-serif;font-weight:900}
.mono{font-family:'JBM',Consolas,'DejaVu Sans Mono',monospace}
.b{font-weight:700}
</style>
<defs><linearGradient id="tg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="900" y2="0" spreadMethod="repeat">
<stop offset="0" stop-color="#ff3b5c"/><stop offset=".25" stop-color="#eb459e"/><stop offset=".5" stop-color="#b39ddb"/><stop offset=".75" stop-color="#7c4dff"/><stop offset="1" stop-color="#ff3b5c"/>
<animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="900 0" dur="6s" repeatCount="indefinite"/>
</linearGradient>
<linearGradient id="fade" gradientUnits="userSpaceOnUse" x1="200" x2="900" y1="0" y2="0"><stop offset="0" stop-color="#eb459e" stop-opacity=".8"/><stop offset="1" stop-color="#7c4dff" stop-opacity="0"/></linearGradient>
<filter id="glow" x="-50%" y="-200%" width="200%" height="500%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<text x="2" y="46" class="orb" font-size="40" fill="none" stroke="#b39ddb" stroke-width="1.2" opacity=".55">02</text>
<text x="84" y="42" class="orb" font-size="26" letter-spacing="3" fill="url(#tg)">MIYU</text>
<line x1="200" x2="896" y1="33" y2="33" stroke="url(#fade)" stroke-width="2"/>
<circle cy="33" r="3.5" fill="#fff" filter="url(#glow)"><animate attributeName="cx" values="200;860" dur="3s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines=".5 0 .5 1"/><animate attributeName="opacity" values="1;1;0" keyTimes="0;.8;1" dur="3s" repeatCount="indefinite"/></circle>
<rect x="886" y="27" width="12" height="12" fill="none" stroke="#eb459e" stroke-width="2" transform="rotate(45 892 33)"/>
