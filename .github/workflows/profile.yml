name: Generate profile graphics

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#7c4dff&color_dots=#ebedf0,#e6c6f0,#d48fd6,#b0408f,#7c2a6e
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#eb459e&color_dots=#161b22,#3b1f4a,#6a2c70,#b0408f,#eb459e

      - uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: .github/3d-contrib.json

      - run: cp profile-3d-contrib/profile-3d.svg dist/

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
